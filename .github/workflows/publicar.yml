name: Publicar Frescario

# Flujo: los cambios se suben a la rama "publicar". Aquí se construyen las imágenes
# para cada arquitectura y, solo si salen bien, se pasan a "main", que es la rama
# que lee Home Assistant. Así nadie ve una versión nueva sin su imagen preparada.

on:
  push:
    branches: [publicar]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  imagenes:
    name: Imagen ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4

      - name: Leer la versión
        id: version
        run: |
          echo "version=$(grep -E '^version:' frescario/config.yaml | sed -E 's/version: *"?([^"]+)"?/\1/')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: frescario
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.arch }}-frescario:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.arch }}-frescario:latest
          labels: |
            io.hass.name=Frescario
            io.hass.type=addon
            io.hass.arch=${{ matrix.arch }}
            io.hass.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  publicar:
    name: Pasar a main
    needs: imagenes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Actualizar main
        run: git push origin HEAD:main
