name: Bug report / Informar de un fallo
description: Something does not work as expected / Algo no funciona como debería
labels: ["bug"]
body:
  - type: textarea
    id: que
    attributes:
      label: What happened? / ¿Qué ha pasado?
      description: Describe the problem and what you expected / Describe el problema y lo que esperabas
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Steps to reproduce / Pasos para reproducirlo
      placeholder: |
        1. Go to... / Ve a...
        2. Tap... / Pulsa...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Frescario version / Versión de Frescario
      placeholder: "1.1.0"
    validations:
      required: true
  - type: dropdown
    id: dispositivo
    attributes:
      label: Device / Dispositivo
      options:
        - Phone (Home Assistant app) / Móvil (app de Home Assistant)
        - Phone browser / Navegador del móvil
        - Tablet
        - Desktop / PC
    validations:
      required: true
  - type: textarea
    id: registro
    attributes:
      label: Log / Registro
      description: From Settings → Apps → Frescario → Log. Remove any personal data / Desde Ajustes → Apps → Frescario → Registro. Quita cualquier dato personal
      render: text
