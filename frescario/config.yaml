name: Frescario
version: "1.4.0"
slug: frescario
description: Gestión de la despensa, la nevera, el congelador y la lista de la compra de casa
url: https://github.com/omorlabs/frescario
image: "ghcr.io/omorlabs/{arch}-frescario"
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:fridge-outline
panel_title: Frescario
panel_admin: false
homeassistant_api: true
hassio_api: true
options:
  administradores: []
  lista_ha: ""
  gemini_api_key: ""
schema:
  administradores:
    - str
  lista_ha: str?
  gemini_api_key: password?
